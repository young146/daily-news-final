name: Sync Unsubscribes

# 수신거부·스팸신고를 명부에 자동 반영한다 (안전망)
#
# 왜 필요한가 (2026-09-04 사장님: "수신 거부는 자동으로 빠지도록 만들지"):
#   1차 방어는 **SendGrid Event Webhook**(`/api/sendgrid/events`) 이 맡는다 — 실시간이다.
#   이건 그 **안전망**이다. 웹훅은 놓칠 수 있다:
#     · SendGrid 콘솔에서 웹훅이 꺼져 있거나 URL 이 바뀐 경우
#     · 배포 중이거나 DB 가 잠깐 안 될 때 온 이벤트
#     · 웹훅을 켜기 **전에** 이미 쌓여 있던 것 (실제로 222명이 그랬다)
#   놓친 것이 있어도 다음 날 아침 발송 전에 맞춰진다.
#
# 언제: 매일 06:00 KST. **뉴스레터 발송보다 먼저** 돌아야 의미가 있다.
#
# ⚠️ 이 작업은 수신거부·스팸신고만 끈다. 반송·차단은 **건드리지 않는다** —
#    그건 거부가 아니라 배달 실패이고, 한국 포털이 거짓으로 "계정 없음"을
#    답한 것을 믿고 84명을 껐다가 되살린 적이 있다(2026-08-28).

on:
  schedule:
    # cron 은 UTC 기준. 21:00 UTC = 다음날 06:00 KST
    - cron: "0 21 * * *"
  workflow_dispatch: {} # Actions 탭에서 수동 실행

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci --ignore-scripts

      - name: Prisma 클라이언트 생성
        run: npx prisma generate

      - name: 수신거부 반영
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: node scripts/deactivate-unsubscribed.mjs --apply
